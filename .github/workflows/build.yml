name: Build and package all platforms
on:
  workflow_dispatch:
    inputs:
      target:
        description: Platform to build
        type: choice
        default: all
        options: [all, android, desktop, macos]
permissions:
  contents: read
jobs:
  desktop:
    timeout-minutes: 25
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'desktop'
    name: Desktop (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: ubuntu-24.04
            platform: linux
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0
      - run: python -m pip install -r requirements-build.txt
      - run: python -m unittest discover -s tests -v
      - run: python render_screenshots.py --platform ${{ matrix.platform }} --output ../docs/screenshots
      - if: runner.os == 'Windows'
        shell: cmd
        run: build-windows.cmd
      - if: runner.os == 'Linux'
        run: ./build-linux.sh
      - name: Smoke test packaged Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CYBERCAT_DATA_DIRECTORY: ${{ runner.temp }}/cybercat-frozen-smoke
        run: |
          $process = Start-Process -FilePath (Resolve-Path 'dist/Focanopy/Focanopy.exe') -ArgumentList '--smoke-test' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Packaged application failed: $($process.ExitCode)" }
      - name: Smoke test packaged Linux app
        if: runner.os == 'Linux'
        env:
          CYBERCAT_DATA_DIRECTORY: ${{ runner.temp }}/cybercat-frozen-smoke
        run: ./dist/Focanopy/Focanopy --smoke-test
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: |
            desktop/dist/Focanopy-Windows.zip
            desktop/dist/Focanopy-Linux.tar.gz
            docs/screenshots/${{ matrix.platform }}-*.png
          if-no-files-found: error
  android:
    timeout-minutes: 25
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'android'
    name: Android APK
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: ./gradlew --no-daemon :app:assembleDebug :app:testDebugUnitTest :app:lintDebug
      - run: |
          mkdir -p ../release
          cp app/build/outputs/apk/debug/app-debug.apk ../release/Focanopy-Android-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: release/Focanopy-Android-debug.apk
  macos:
    timeout-minutes: 25
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'macos'
    name: macOS universal app
    runs-on: macos-15
    defaults:
      run:
        working-directory: macos
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - run: ./test.sh
      - run: CYBERCAT_UNIVERSAL=1 ./build.sh
      - run: |
          swiftc -parse-as-library Sources/MochiStopwatch/Model.swift Sources/MochiStopwatch/Cloud.swift Sources/MochiStopwatch/AccountView.swift Sources/MochiStopwatch/Views.swift Tools/RenderScreenshots.swift -o /tmp/cybercat-screenshots
          /tmp/cybercat-screenshots ../docs/screenshots
          mkdir -p ../release
          ditto -c -k --sequesterRsrc --keepParent '../Focanopy.app' ../release/Focanopy-macOS-universal.zip
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: |
            release/Focanopy-macOS-universal.zip
            docs/screenshots/macos-*.png
