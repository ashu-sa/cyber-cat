name: Portable Linux and Fedora checks
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: Build portable x86-64 Linux
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install native build requirements
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-icccm4 libxcb-xinerama0 libxcb-xkb1 desktop-file-utils xvfb xauth
      - name: Test and package
        working-directory: desktop
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pip install -r requirements-build.txt
          python -m unittest discover -s tests -v
          ./build-appimage.sh
      - name: Launch AppImage without FUSE on Ubuntu
        env:
          CYBERCAT_DATA_DIRECTORY: ${{ runner.temp }}/focanopy-ubuntu-smoke
        run: |
          env -u QT_QPA_PLATFORM xvfb-run -a desktop/dist/Focanopy-Linux-x86_64.AppImage --appimage-extract-and-run --smoke-test
      - uses: actions/upload-artifact@v4
        with:
          name: portable-linux
          path: |
            desktop/dist/Focanopy-Linux-x86_64.AppImage
            desktop/dist/Focanopy-Linux.tar.gz
            desktop/dist/SHA256SUMS-Linux.txt
          if-no-files-found: error
  fedora:
    name: Fedora ${{ matrix.version }} runtime
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        version: ['43', '44']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: portable-linux
          path: portable-linux
      - name: Test X11 and Wayland backends in Fedora
        run: |
          docker run --rm -v "$PWD/portable-linux:/artifacts:ro" -v "$PWD/desktop/packaging/linux:/checks:ro" fedora:${{ matrix.version }} bash /checks/fedora-smoke.sh
